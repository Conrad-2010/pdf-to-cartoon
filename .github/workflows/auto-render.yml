name: 🎬 PDF to Cartoon Auto-Render

# Trigger when a PDF is pushed to the input folder, or manually via the Actions tab
on:
  push:
    branches:
      - main
    paths:
      - 'input/*.pdf'
  workflow_dispatch:

jobs:
  animate:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🛠️ Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📂 Create output directory
        run: mkdir -p output

      - name: 🎨 Render PDFs to Cartoon Animation
        run: |
          # Loop through all PDFs in the input folder
          for pdf in input/*.pdf; do
            if [ -f "$pdf" ]; then
              filename=$(basename "$pdf" .pdf)
              echo "🚀 Processing $pdf..."
              python pdf_to_cartoon.py "$pdf" "output/${filename}_cartoon.mp4"
            fi
          done

      - name: 📤 Upload MP4 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-animations
          path: output/*.mp4
          retention-days: 14 # Keeps the video available for download for 14 days
